name: MixCut v0.16.3 Runtime Log Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Download official MixCut Windows v0.16.3 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/RoshanGH/mixcut-windows/archive/refs/tags/v0.16.3.zip' -OutFile mixcut-official.zip
          Expand-Archive mixcut-official.zip -DestinationPath work
          $src = Get-ChildItem work -Directory | Select-Object -First 1
          Rename-Item $src.FullName MixCutSource

      - name: Apply ONLY top runtime-log patch
        shell: powershell
        run: |
          python ci/apply_runtime_log_patch.py work/MixCutSource
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed' }

      - name: Resolve and download official v0.16.3 installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $json = $null
          foreach($u in @('http://47.119.175.47/mixcut/versions.json','https://47.119.175.47/mixcut/versions.json')) {
            try { $json = Invoke-RestMethod $u -TimeoutSec 20; if($json){break} } catch { Write-Host "versions fail $u" }
          }
          if(-not $json) { throw 'Cannot fetch official versions.json' }
          $urls = New-Object System.Collections.Generic.List[string]
          function Walk($o) {
            if($null -eq $o){return}
            if($o -is [string]) { if($o -match '^https?://' -and ($o -match 'win|windows|setup|exe|download')) { $urls.Add($o) }; return }
            if($o -is [System.Collections.IDictionary]) { foreach($k in $o.Keys){ Walk $o[$k] }; return }
            if($o -is [System.Collections.IEnumerable]) { foreach($i in $o){ Walk $i }; return }
            foreach($p in $o.PSObject.Properties){ Walk $p.Value }
          }
          Walk $json
          $direct = $urls | Where-Object { $_ -match '\.exe($|\?)' } | Select-Object -First 1
          if(-not $direct){ throw 'No direct official Windows installer URL found' }
          Invoke-WebRequest $direct -OutFile official-setup.exe -MaximumRedirection 10
          if((Get-Item official-setup.exe).Length -lt 10MB){ throw 'Official installer too small' }

      - name: Install official package into staging directory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $stage = Join-Path $PWD 'official-installed'
          New-Item -ItemType Directory $stage -Force | Out-Null
          $p = Start-Process "$PWD\official-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$stage" -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Official installer failed: $($p.ExitCode)" }
          if(-not (Test-Path "$stage\MixCut.exe")){ throw 'Official MixCut.exe not found' }

      - name: Build patched official WPF source
        shell: powershell
        run: |
          dotnet publish work/MixCutSource/src/MixCut/MixCut.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -o patched-publish -nologo
          if($LASTEXITCODE -ne 0){ throw 'dotnet publish failed' }

      - name: Overlay patched app code while preserving official dependencies
        shell: powershell
        run: |
          $stage = Join-Path $PWD 'official-installed'
          robocopy patched-publish $stage /E /XF *.pdb /XD bin | Out-Host
          if($LASTEXITCODE -gt 7){ throw "robocopy failed: $LASTEXITCODE" }
          foreach($f in @('ffmpeg.exe','whisper-cli.exe','demucs.exe')) { if(-not (Test-Path "$stage\bin\$f")){ throw "Official dependency missing: $f" } }

      - name: Build installer
        shell: powershell
        run: |
          @'
          #define MyAppName "MixCut"
          #define MyAppVersion "0.16.3"
          #define MyAppPublisher "MixCut"
          #define MyAppURL "https://github.com/RoshanGH/mixcut-windows"
          #define MyAppExeName "MixCut.exe"
          [Setup]
          AppId={{B7C8F2E0-5B3A-4D1A-9E4F-3C2A1B0E5D6F}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          DefaultDirName={localappdata}\Programs\{#MyAppName}
          DefaultGroupName={#MyAppName}
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          MinVersion=10.0.17763
          DisableProgramGroupPage=yes
          WizardStyle=modern
          Compression=lzma2/max
          SolidCompression=yes
          OutputDir=out
          OutputBaseFilename=安装_MixCut_Windows_v0.16.3_顶部详细运行日志增强版
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "其它任务:"; Flags: unchecked
          [Files]
          Source: "official-installed\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{group}\卸载 {#MyAppName}"; Filename: "{uninstallexe}"
          Name: "{userdesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "立即启动 {#MyAppName}"; Flags: nowait postinstall skipifsilent
          '@ | Out-File build.iss -Encoding utf8
          New-Item -ItemType Directory out -Force | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' build.iss
          if($LASTEXITCODE -ne 0){ throw 'Inno Setup failed' }

      - name: Create source zip and hashes
        shell: powershell
        run: |
          Copy-Item ci/apply_runtime_log_patch.py work/MixCutSource/APPLIED_RUNTIME_LOG_PATCH_SCRIPT.py
          Compress-Archive -Path work/MixCutSource/* -DestinationPath MixCut_Windows_v0.16.3_顶部详细运行日志增强版_完整源码.zip -CompressionLevel Optimal
          $installer = Get-ChildItem out -Filter '*.exe' | Select-Object -First 1
          $source = Get-Item MixCut_Windows_v0.16.3_顶部详细运行日志增强版_完整源码.zip
          @("$((Get-FileHash $installer.FullName -Algorithm SHA256).Hash)  $($installer.Name)","$((Get-FileHash $source.FullName -Algorithm SHA256).Hash)  $($source.Name)") | Set-Content MixCut_Windows_v0.16.3_SHA256SUMS.txt

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: MixCut-Windows-v0.16.3-runtime-log-deliverables
          path: |
            out/*.exe
            MixCut_Windows_v0.16.3_顶部详细运行日志增强版_完整源码.zip
            MixCut_Windows_v0.16.3_SHA256SUMS.txt
          retention-days: 1
